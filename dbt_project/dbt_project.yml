name: 'transactions_platform'
version: '1.0.0'
config-version: 2

profile: 'transactions_platform'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transactions_platform:
    +materialized: view

    staging:
      # Staging is a thin, non-materialised layer: rename, cast, filter.
      # Views keep it cheap and guarantee it always reflects bronze.
      +materialized: view
      +schema: staging

    marts:
      # Marts are consumer-facing and must be queryable with predictable
      # latency, so they are tables rather than views.
      +materialized: table
      +schema: marts

vars:
  # Lookback applied by the incremental mart, matching the ingestion
  # lookback so a late-arriving record that lands in bronze also triggers
  # recomputation of its business date. If these two diverge, the mart can
  # silently miss a day that bronze has corrected.
  summary_lookback_days: 3
