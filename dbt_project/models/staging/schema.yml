version: 2

sources:
  - name: raw
    # Declared explicitly. Without this, dbt resolves a source's schema from
    # the source NAME, which would put bronze in a schema called `raw` while
    # the models sat in `silver` and `gold` - two naming schemes in one
    # warehouse. The source keeps its short name; the tables live in `bronze`.
    schema: bronze
    description: >
      Bronze and quarantine tables produced by the ingestion pipeline. Written
      by ingestion/pipeline.py, not by dbt, so dbt treats them as sources
      rather than models.
    meta:
      owner: data-platform-team
      contains_pii: true
      data_classification: confidential
      # dbt-duckdb reads these as external CSV rather than as database tables.
      #
      # The pipeline writes SQLite (sqlite3 is standard library; duckdb is
      # not, and the pipeline is dependency-free). DuckDB can attach a SQLite
      # file, but only via the sqlite_scanner extension, and extension
      # downloads are blocked on corporate networks - extensions.duckdb.org
      # returns 403 behind the proxy. Depending on it would mean the dbt path
      # works on an open network and fails everywhere else.
      #
      # CSV needs no extension, so the project runs anywhere. Produced by
      # scripts/export_for_dbt.py, which must run before dbt.
      # all_varchar preserves bronze fidelity. Bronze stores every field as
      # the raw text the API sent, deliberately - it is the unmodified record.
      # Letting DuckDB infer types on read would silently reinterpret that
      # text (transaction_date becomes TIMESTAMP, amount becomes DOUBLE),
      # which both breaks string handling in staging and reintroduces the
      # float-for-money problem the pipeline avoids. Casting is staging's
      # job, done explicitly, once.
      external_location: "read_csv('../warehouse/export/{name}.csv', header=true, all_varchar=true)"
    tables:
      - name: bronze_transactions
        description: >
          Every record the API returned that passed schema validation,
          unmodified, plus ingestion metadata. Append-and-upsert only.
          Duplicates are present and flagged rather than removed.
        loaded_at_field: ingestion_timestamp
        freshness:
          # Source freshness is the producer-side half of the consumer SLA.
          # Breaching warn_after means the mart is about to go stale.
          warn_after: {count: 26, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: transaction_id
            description: Application-level unique identifier, format TXN-NNNN.
            tests:
              - unique
              - not_null
          - name: is_duplicate
            description: >
              1 when this record shares a natural key with an earlier record
              and is not the surviving row of its group.
            tests:
              - accepted_values:
                  values: [0, 1]
          - name: status
            tests:
              - accepted_values:
                  values: ['completed', 'pending', 'failed', 'reversed']
          - name: transaction_type
            tests:
              - accepted_values:
                  values: ['debit', 'credit']
          - name: currency
            tests:
              - accepted_values:
                  values: ['USD', 'EUR', 'GBP', 'CHF', 'JPY', 'AUD', 'CAD']

      - name: quarantine_transactions
        description: >
          Records that failed schema validation, with every violation and the
          time of ingestion. Restricted to the owning team: it concentrates
          malformed records that may still carry real account identifiers.
        columns:
          - name: error_reason
            description: All violations for the record, semicolon separated.
            tests:
              - not_null
          - name: error_count
            tests:
              - not_null

models:
  - name: stg_transactions
    description: >
      Validated, deduplicated transactions. The single definition of a usable
      transaction; every mart builds from here.
    meta:
      owner: data-platform-team
      layer: silver
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: natural_key_hash
        description: >
          Hash over every field except transaction_id. After deduplication
          this must be unique: two surviving rows sharing a natural key would
          mean the deduplication logic has failed.
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"
      - name: transaction_day
        tests:
          - not_null
